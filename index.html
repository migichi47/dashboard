<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- header -->
    <div class="header">
      <div class="left-section">
        <h1>CampusKart</h1>
      </div>

      <div class="middle-section">
        <div class="search-bar">
          <span class="search-icon"> &#128269;</span>
          <input type="text" placeholder="Search items..." />
        </div>
        <button class="search-btn">Filter</button>
      </div>

      <div class="right-section">
        <div class="profile">
          <img class="profile-icon" src="images/profile-photo.jpg" alt="" />
          <p>Hi! Alex</p>
        </div>
        <div class="cart-icon">🛒</div>
      </div>
    </div>

    <!-- hero section -->
    <div class="hero-container">
      <div class="hero">
        <div class="hero-content">
          <div class="hero-link-container">
            <a href="" class="hero-link hero-link-selected">Home</a>
            <a href="" class="hero-link">Category</a>
            <a href="" class="hero-link">Sell</a>
          </div>

          <h1 class="hero-header">Buy & sell Easily on <span>Campus</span></h1>

          <p>
            Find great deals on items around campus or sell items to people
            around campus.
          </p>

          <div class="hero-buttons">
            <button class="browse-btn">Browse</button>
            <button class="sell-item-btn"><span>+</span>Sell an Item</button>
          </div>
        </div>
        <div class="hero-image-container">
          <img src="images/hero image.jpg" alt="" />
        </div>
      </div>
    </div>

    <!-- Categories overview -->
    <div class="browse-categories">
      <h1>Browse Categories</h1>
      <div class="categories-grid">
        <div class="category-card">
          <img src="images/clothes.jpg" alt="" class="category-card-image" />
          <div class="category-card-description">
            <p>Clothes</p>
            <span class="category-card-icon">👕</span>
          </div>
        </div>
        <div class="category-card">
          <img
            src="images/electronics.jpg"
            alt=""
            class="category-card-image"
          />
          <div class="category-card-description">
            <p>Electronics</p>
            <span class="category-card-icon">🔌</span>
          </div>
        </div>
        <div class="category-card">
          <img src="images/furniture.jpg" alt="" class="category-card-image" />
          <div class="category-card-description">
            <p>Furniture</p>
            <span class="category-card-icon">🪑</span>
          </div>
        </div>
        <div class="category-card">
          <img src="images/bike.jpg" alt="" class="category-card-image" />
          <div class="category-card-description">
            <p>Other</p>
            <span class="category-card-icon">🚲</span>
          </div>
        </div>
      </div>
    </div>

    <!-- footer -->
    <div class="footer">
      <div class="left-footer-section">
        <h3>CampusKart</h3>
      </div>
      <div class="right-footer-section">
        <a href="">About Us</a>
        <a href="">Contact</a>
        <a href="">Privacy Policy</a>
      </div>
    </div>
  </body>
</html>
